<?xml version="1.0" encoding="UTF-8"?>
<!-- Android adaptive icon foreground layer.
     Canvas is 1024×1024. Safe zone (visible on all shapes) is the center 66% circle.
     All meaningful content MUST stay within r≈330 from center (x=512, y=512). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Gold gradient for the Om symbol -->
    <radialGradient id="goldGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFE580"/>
      <stop offset="50%" stop-color="#F0D050"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>

    <!-- Subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer mandala ring (decorative, sits just inside safe zone) -->
  <g opacity="0.35" transform="translate(512,512)">
    <!-- 8 dots around circle at r=270 (representing 8-fold path) -->
    <g fill="#F0D050">
      <circle cx="0" cy="-270" r="8"/>
      <circle cx="191" cy="-191" r="6"/>
      <circle cx="270" cy="0" r="8"/>
      <circle cx="191" cy="191" r="6"/>
      <circle cx="0" cy="270" r="8"/>
      <circle cx="-191" cy="191" r="6"/>
      <circle cx="-270" cy="0" r="8"/>
      <circle cx="-191" cy="-191" r="6"/>
    </g>
    <!-- Thin dotted ring -->
    <circle cx="0" cy="0" r="300" fill="none" stroke="#F0D050" stroke-width="1.5" stroke-dasharray="2 6"/>
    <circle cx="0" cy="0" r="250" fill="none" stroke="#F0D050" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Central Om symbol (ॐ) -->
  <g filter="url(#glow)">
    <text x="512" y="625"
          font-family="'Noto Serif Devanagari', 'Yatra One', 'Sanskrit Text', serif"
          font-size="400"
          font-weight="900"
          text-anchor="middle"
          fill="url(#goldGrad)"
          stroke="#8B6914"
          stroke-width="2">ॐ</text>
  </g>

  <!-- Small "108" text below (tiny, for symbolism) -->
  <g opacity="0.55">
    <text x="512" y="785"
          font-family="'Cinzel', serif"
          font-size="52"
          font-weight="700"
          letter-spacing="12"
          text-anchor="middle"
          fill="#F0D050">108</text>
  </g>
</svg>
