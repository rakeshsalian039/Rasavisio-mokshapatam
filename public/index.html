<!-- ── Ambient audio preload ──
     Android WebView ignores <link rel="prefetch" as="audio"> — the file gets
     re-fetched on every click (we measured 1.8MB transfer on "Play Solo").
     A real <audio preload="auto"> element is honored by every engine and
     keeps the decoded buffer in memory so later `new Audio(same-url)`
     instances hit cache. Hidden + muted so nothing plays until user action.
     -->
<audio id="preload-ambient" src="/ambient.mp3" preload="auto" muted
       style="display:none;position:absolute;pointer-events:none" aria-hidden="true"></audio>

<!-- Lower-priority audio still uses prefetch — only used after user action
     and works well enough over HTTP cache on browser; Android can live
     without them preloaded since they're tiny compared to ambient.mp3. -->
<link rel="prefetch" href="/temple-bell.mp3" as="audio"/>
<link rel="prefetch" href="/onboarding/story-0-en.mp3" as="audio"/>
<link rel="prefetch" href="/onboarding/story-0-hi.mp3" as="audio"/>
<link rel="prefetch" href="/yama-en.mp3" as="audio"/>
